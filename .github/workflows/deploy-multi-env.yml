name: Deploy Multi Environment

on:
  push:
    branches:
      - Dev
      - demo/org-onboarding
  workflow_dispatch:
    inputs:
      target_environment:
        description: "Deployment environment override (dev or demo)"
        required: false
        default: ""

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    environment: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.target_environment != '' && github.event.inputs.target_environment) || (github.ref_name == 'Dev' && 'dev' || 'demo') }}

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve deploy environment
        id: resolve
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ github.event.inputs.target_environment }}" ]]; then
            DEPLOY_ENV="${{ github.event.inputs.target_environment }}"
          elif [[ "${{ github.ref_name }}" == "Dev" ]]; then
            DEPLOY_ENV="dev"
          else
            DEPLOY_ENV="demo"
          fi
          echo "deploy_env=${DEPLOY_ENV}" >> "$GITHUB_OUTPUT"
          echo "Deploy environment: ${DEPLOY_ENV}"

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_AWS_REGION: ${{ vars.VITE_AWS_REGION }}
          VITE_COGNITO_USER_POOL_ID: ${{ secrets.VITE_COGNITO_USER_POOL_ID }}
          VITE_COGNITO_CLIENT_ID: ${{ secrets.VITE_COGNITO_CLIENT_ID }}
          VITE_USE_MOCK_AUTH: ${{ vars.VITE_USE_MOCK_AUTH }}
        run: npm run build

      - name: Trigger Amplify deployment
        env:
          AMPLIFY_APP_ID: ${{ secrets.AMPLIFY_APP_ID }}
          AMPLIFY_BRANCH: ${{ vars.AMPLIFY_BRANCH }}
        run: |
          if [ -z "$AMPLIFY_APP_ID" ]; then
            echo "AMPLIFY_APP_ID is missing for environment ${{ steps.resolve.outputs.deploy_env }}"
            exit 1
          fi
          if [ -z "$AMPLIFY_BRANCH" ]; then
            echo "AMPLIFY_BRANCH is missing for environment ${{ steps.resolve.outputs.deploy_env }}"
            exit 1
          fi

          aws amplify start-job \
            --app-id "$AMPLIFY_APP_ID" \
            --branch-name "$AMPLIFY_BRANCH" \
            --job-type RELEASE
