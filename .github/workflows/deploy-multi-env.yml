name: Deploy Multi Environment

on:
  push:
    branches:
      - showcase
      - demo/org-onboarding
  workflow_dispatch:
    inputs:
      target_environment:
        description: "Deployment environment override (dev or demo)"
        required: false
        default: ""

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    environment: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.target_environment != '' && github.event.inputs.target_environment) || (github.ref_name == 'showcase' && 'dev' || 'demo') }}

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve deploy environment
        id: resolve
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ github.event.inputs.target_environment }}" ]]; then
            DEPLOY_ENV="${{ github.event.inputs.target_environment }}"
          elif [[ "${{ github.ref_name }}" == "showcase" ]]; then
            DEPLOY_ENV="dev"
          else
            DEPLOY_ENV="demo"
          fi
          echo "deploy_env=${DEPLOY_ENV}" >> "$GITHUB_OUTPUT"
          echo "Deploy environment: ${DEPLOY_ENV}"

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_AWS_REGION: ${{ vars.VITE_AWS_REGION }}
          VITE_COGNITO_USER_POOL_ID: ${{ secrets.VITE_COGNITO_USER_POOL_ID }}
          VITE_COGNITO_CLIENT_ID: ${{ secrets.VITE_COGNITO_CLIENT_ID }}
          VITE_USE_MOCK_AUTH: ${{ vars.VITE_USE_MOCK_AUTH }}
          VITE_SURICATA_API_URL: ${{ github.ref_name != 'showcase' && vars.VITE_SURICATA_API_URL || '' }}
        run: npm run build

      - name: Deploy to S3
        run: |
          aws s3 sync frontend/dist/ "s3://${{ secrets.S3_BUCKET_NAME }}/" \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html"

          aws s3 cp frontend/dist/index.html "s3://${{ secrets.S3_BUCKET_NAME }}/index.html" \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.CF_DISTRIBUTION_ID }}" \
            --paths "/*"
